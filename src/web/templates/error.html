{% extends "base.html" %}

{% block title %}Error - Route Stories{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h1>Oops! Something went wrong</h1>
        <p class="error-message">{{ error }}</p>
        <div class="error-actions">
            <button class="btn btn-primary" onclick="window.location.href='/'">
                Return Home
            </button>
        </div>
    </div>
</div>

<style>
.error-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
}

.error-card {
    text-align: center;
    max-width: 500px;
    padding: 3rem;
}

.error-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
}

.error-message {
    color: #6B7280;
    margin: 1.5rem 0;
}

.error-actions {
    margin-top: 2rem;
}
</style>
{% endblock %}
